services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Pull the default model after Ollama starts
  ollama-pull:
    image: ollama/ollama:latest
    container_name: rag-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "llama3"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  api:
    build: .
    container_name: rag-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - RAG_LLM_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: ["rag", "serve", "--host", "0.0.0.0", "--port", "8000"]

  ui:
    build: .
    container_name: rag-ui
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - RAG_LLM_BASE_URL=http://ollama:11434
    depends_on:
      - api
    command: >
      streamlit run src/rag_pipeline/ui.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true

volumes:
  ollama_data:
