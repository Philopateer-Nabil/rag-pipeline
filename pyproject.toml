[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Production-quality RAG pipeline with FAISS, local embeddings, and Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-ollama>=0.2.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",
    "pypdf>=4.0.0",
    "unstructured>=0.10.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.30.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[project.scripts]
rag = "rag_pipeline.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_pipeline"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/rag_pipeline"]
omit = ["*/cli/*", "*/api/app.py"]
